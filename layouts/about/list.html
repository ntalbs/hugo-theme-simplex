<!DOCTYPE html>
<html>
  <head>
    {{ partial "header" . }}
  </head>
  <body>
    {{ partial "progress" . }}
    {{ partial "page-top" . }}
    <main class="container" role="main">
      <article class="post">
        <header>
          <h1 class="post-title"> {{ .Title }} </h1>
        </header>
        <section class="post-content">
          {{ .Content }}
        </section>
        {{ partial "social" . }}
      </article>
      <div style="text-align: center">
        <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="ntalbs" data-color="#FFDD00" data-emoji=""  data-font="Cookie" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff" ></script>
      </div>
    </main>
    {{ partial "footer" . }}
    {{ partial "page-bottom" . }}
  </body>
</html>
